name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: common

      - name: Update and install required packages
        run: |
          sudo apt update
          sudo apt install -y libc6-dev clang flex bison libssl-dev bc python3 zip unzip lld llvm p7zip-full ccache jq
      - name: Set up ccache
        run: |
          ccache --version
          ccache --max-size=2G
          ccache --set-config=compression=true
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
      - name: Restore ccache from cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.sha }}
          restore-keys: |
            ccache-
      - name: Prepare magiskboot
        run: |
          mkdir -p $GITHUB_WORKSPACE/output
          cd $GITHUB_WORKSPACE/output
          curl -L -o magiskboot.7z "https://github.com/xiaoxindada/magisk_bins_ndk/releases/download/magisk_bins-29001-cf09f1c1061138652a435cba3e675508730b0464/magisk_bins.7z"
          7z x magiskboot.7z
          cp ./native/out/x86_64/magiskboot .
          chmod +x magiskboot
          rm -rf ./out
      - name: Prepare boot.img
        run: |
          cd $GITHUB_WORKSPACE/output
          export lineageos_ver=$(curl -LfsG "https://download.lineageos.org/api/v1/lisa/nightly/0" | jq -r '.response[0].filename' | cut -d- -f3)   
          echo "RELEASE_TAG=$lineageos_ver" >> $GITHUB_ENV                                                                    
          curl -L -o boot.img "https://mirrorbits.lineageos.org/full/lisa/$lineageos_ver/boot.img"
      - name: Prepare required toolchains
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchains
          cd $GITHUB_WORKSPACE/toolchains
          git clone https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 --branch=main-kernel-build-2024 --depth=1
      - name: Remove unnecessary tools
        run: |
          cd $GITHUB_WORKSPACE/toolchains/linux-x86
          latest_clang=$(find . -maxdepth 1 -type d -name "clang-r*" | sed 's|.*/||' | sort -Vr | head -n 1)
          echo "Latest Clang version detected: $latest_clang"
          
          for dir in clang-r*; do
            if [[ "$dir" != "$latest_clang" ]]; then
              echo "Removing $dir"
              rm -rf "$dir"
            fi
          done
          # Export path
          export PATH="$GITHUB_WORKSPACE/toolchains/linux-x86/$latest_clang/bin:$PATH"
      - name: Clone Other Dependencies
        run: |
          cd "$GITHUB_WORKSPACE"
          SUSFS_BRANCH="gki-android15-6.6"
          echo "Using branch for SUSFS: $SUSFS_BRANCH"
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b "$SUSFS_BRANCH"
          cd susfs4ksu
          echo "SUSFS_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          cd ..
          git clone https://github.com/WildPlusKernel/kernel_patches.git
      - name: Add KernelSU
        run: |
          cd "$GITHUB_WORKSPACE/common"
          curl -LSs "https://raw.githubusercontent.com/WildKernels/Wild_KSU/wild/kernel/setup.sh" | bash -s wild
          cd Wild_KSU
          echo "KSU_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          cd ..
      - name: Apply SUSFS Patches
        run: |
          cd "$GITHUB_WORKSPACE"
          
          # Copy SUSFS patches
          cp susfs4ksu/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch ./common
          cd common
          
          # patch -p1 --forward < fix+fs_Makefile+50_add_susfs_in_gki-android15-6.6.patch.patch
          # patch -p1 --forward < fix+fs_exec.c+50_add_susfs_in_gki-android15-6.6.patch.patch
          # patch -p1 --forward < fix+fs_namei.c+50_add_susfs_in_gki-android15-6.6.patch.patch
          # patch -p1 --forward < fix+fs_namespace.c+50_add_susfs_in_gki-android15-6.6.patch.patch
          # patch -p1 --forward < fix+fs_notify_fdinfo.c+50_add_susfs_in_gki-android15-6.6.patch.patch
          # patch -p1 --forward < fix+fs_open.c+50_add_susfs_in_gki-android15-6.6.patch.patch
          # patch -p1 --forward < fix+fs_proc_bootconfig.c+50_add_susfs_in_gki-android15-6.6.patch.patch
          # patch -p1 --forward < fix+fs_proc_fd.c+50_add_susfs_in_gki-android15-6.6.patch.patch
          # patch -p1 --forward < fix+fs_proc_task_mmu.c+50_add_susfs_in_gki-android15-6.6.patch.patch
          # patch -p1 --forward < fix+fs_readdir.c+50_add_susfs_in_gki-android15-6.6.patch.patch
          # patch -p1 --forward < fix+fs_stat.c+50_add_susfs_in_gki-android15-6.6.patch.patch
          # patch -p1 --forward < fix+include_linux_mount.c+50_add_susfs_in_gki-android15-6.6.patch.patch
          # patch -p1 --forward < fix+security_selinux_avc.c+50_add_susfs_in_gki-android15-6.6.patch.patch
          # 
          # patch -p1 --forward < 50_add_susfs_in_gki-android15-6.6.patch
          # cp ../susfs4ksu/kernel_patches/fs/* ./fs/
          # cp ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/
          # 
          # echo "Applying SUSFS patches..."
          # cd ./Wild_KSU
          # cp ../../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./
          # patch -p1 --forward < 10_enable_susfs_for_ksu.patch || true
          # 
          # # cp ../../kernel_patches/next/susfs_fix_patches/v1.5.9/fix_apk_sign.c.patch ./
          # # patch -p1 --forward < fix_apk_sign.c.patch
          # 
          # cp ../../kernel_patches/wild/susfs_fix_patches/v1.5.9/fix_core_hook.c.patch ./
          # patch -p1 --forward --fuzz=3 < fix_core_hook.c.patch
          # 
          # # cp ../../kernel_patches/wild/susfs_fix_patches/v1.5.9/fix_rules.c.patch ./
          # # patch -p1 --forward < fix_rules.c.patch
          # 
          # cp ../../kernel_patches/wild/susfs_fix_patches/v1.5.9/fix_sucompat.c.patch ./
          # patch -p1 --forward < fix_sucompat.c.patch
          # 
          # cp ../../kernel_patches/wild/susfs_fix_patches/v1.5.9/fix_kernel_compat.c.patch ./
          # patch -p1 --forward < fix_kernel_compat.c.patch
      - name: Apply Hooks Patches
        run: |
          cd "$GITHUB_WORKSPACE/common"
          
          echo "Applying hooks..."
          cp ../kernel_patches/wild/hooks/scope_min_manual_hooks_v1.4.patch ./
          patch -p1 -F 3 < scope_min_manual_hooks_v1.4.patch
      - name: Apply Hide Stuff Patches
        run: |
          cd "$GITHUB_WORKSPACE/common"
          cp ../kernel_patches/69_hide_stuff.patch ./
          patch -p1 -F 3 < 69_hide_stuff.patch
      - name: Add Configuration Settings
        run: |
          cd "$GITHUB_WORKSPACE/common"
          echo "Adding configuration settings to lisa_defconfig..."
          
          # Add KSU configuration settings
          echo "CONFIG_KSU=y" >> ./arch/arm64/configs/lisa_defconfig
          
          echo "CONFIG_KSU_KPROBES_HOOK=n" >> ./arch/arm64/configs/lisa_defconfig
          
          # Add additional tmpfs config setting
          echo "CONFIG_TMPFS_XATTR=y" >> ./arch/arm64/configs/lisa_defconfig
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> ./arch/arm64/configs/lisa_defconfig
          
          # Add additional config setting
          echo "CONFIG_IP_NF_TARGET_TTL=y" >> ./arch/arm64/configs/lisa_defconfig
          echo "CONFIG_IP6_NF_TARGET_HL=y" >> ./arch/arm64/configs/lisa_defconfig
          echo "CONFIG_IP6_NF_MATCH_HL=y" >> ./arch/arm64/configs/lisa_defconfig
          
          # Add BBR Config
          echo "CONFIG_TCP_CONG_ADVANCED=y" >> ./arch/arm64/configs/lisa_defconfig 
          echo "CONFIG_TCP_CONG_BBR=y" >> ./arch/arm64/configs/lisa_defconfig
          echo "CONFIG_NET_SCH_FQ=y" >> ./arch/arm64/configs/lisa_defconfig
          echo "CONFIG_TCP_CONG_BIC=n" >> ./arch/arm64/configs/lisa_defconfig
          echo "CONFIG_TCP_CONG_WESTWOOD=n" >> ./arch/arm64/configs/lisa_defconfig
          echo "CONFIG_TCP_CONG_HTCP=n" >> ./arch/arm64/configs/lisa_defconfig 
          
          # Remove check_defconfig
          sed -i 's/check_defconfig//' ./build.config.gki
      - name: Add SUSFS Configuration Settings
        run: |
          cd "$GITHUB_WORKSPACE/common"
          
          # Add SUSFS configuration settings
          echo "CONFIG_KSU_SUSFS=y" >> ./arch/arm64/configs/lisa_defconfig
          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> ./arch/arm64/configs/lisa_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> ./arch/arm64/configs/lisa_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> ./arch/arm64/configs/lisa_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> ./arch/arm64/configs/lisa_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> ./arch/arm64/configs/lisa_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> ./arch/arm64/configs/lisa_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n" >> ./arch/arm64/configs/lisa_defconfig
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> ./arch/arm64/configs/lisa_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y" >> ./arch/arm64/configs/lisa_defconfig
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> ./arch/arm64/configs/lisa_defconfig
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> ./arch/arm64/configs/lisa_defconfig
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> ./arch/arm64/configs/lisa_defconfig
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=n" >> ./arch/arm64/configs/lisa_defconfig
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> ./arch/arm64/configs/lisa_defconfig
          
          echo "CONFIG_KSU_SUSFS_SUS_SU=n" >> ./arch/arm64/configs/lisa_defconfig
      - name: Build Kernel
        run: |
          cd $GITHUB_WORKSPACE/common
          chmod +x build.sh
          ./build.sh
          cp $GITHUB_WORKSPACE/common/out/arch/arm64/boot/Image $GITHUB_WORKSPACE/output
          ccache --show-stats
          df -H .
      - name: Modify boot.img
        run: |
          cd $GITHUB_WORKSPACE/output
          ./magiskboot unpack boot.img
          rm -rf kernel
          mv Image kernel
          ./magiskboot repack boot.img
          7z a new-boot.7z new-boot.img
      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: new-boot
          path: /home/runner/work/android_kernel_xiaomi_sm8350/android_kernel_xiaomi_sm8350/output/new-boot.img
      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body: |
            Boot image for LineageOS ${{ env.RELEASE_TAG }} build
            KernelSU Wild ${{ env.KSU_TAG }} + SUSFS ${{ env.SUSFS_TAG }}
          files: |
            /home/runner/work/android_kernel_xiaomi_sm8350/android_kernel_xiaomi_sm8350/output/new-boot.img
            /home/runner/work/android_kernel_xiaomi_sm8350/android_kernel_xiaomi_sm8350/output/new-boot.7z
            
